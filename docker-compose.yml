services:

  # ── Routario Application ─────────────────────────────────────────
  routario:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.arvancloud.ir/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://mirror-pypi.runflare.com/simple}
    image: routario:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://routario:routariopass@postgres/routario?ssl=disable
      REDIS_URL: redis://redis:6379
      GEOCODING_ENABLED: false
      VAPID_PUBLIC_KEY: BGQ3prURPQf1PZSGKySh1Mnr1QQW5pVBGZujTApG_zhqKxGnCz30umqOg5Mh_Q6U-5nNbAtO7XVmz0G-3RR_84g
      VAPID_PRIVATE_KEY: Qk1wdfPJGQ4nLYN2SKLNGR5Z3FrD-e_LfByMTUyJ3Hc
      VALHALLA_URL: http://valhalla:8002
    volumes:
      - ./routario/uploads:/app/web/uploads
    ports:
      # Web UI + API + WebSocket
      - "8000:8000"
      # GPS Protocol Ports
      - "5001:5001"     # TK103
      - "5013:5013"     # H02
      - "5020:5020"     # Meitrack
      - "5023:5023"     # GT06 / Concox
      - "5026:5026"     # Queclink
      - "5027:5027"     # Teltonika (TCP)
      - "5027:5027/udp" # Teltonika (UDP)
      - "5050:5050"     # Dolphin DO-107 (TCP)
      - "5055:5055"     # OsmAnd
      - "5149:5149"     # Flespi
    networks:
      - routario-net

  # ── PostgreSQL 18 + PostGIS ──────────────────────────────────────
  postgres:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    shm_size: 1g
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c max_connections=150
      -c enable_partition_pruning=on
      -c enable_partitionwise_join=on
      -c enable_partitionwise_aggregate=on
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
    environment:
      POSTGRES_DB:       routario
      POSTGRES_USER:     routario
      POSTGRES_PASSWORD: routariopass
      PGDATA:            /var/lib/postgresql/data
    volumes:
      - ./routario/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5459:5432"
    networks:
      - routario-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routario -d routario"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (v8) ───────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --loglevel warning --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - routario-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Valhalla (road speed limit lookups) ──────────────────────────
  # On first start, Valhalla downloads the configured OSM extract and
  # builds routing tiles — this can take several minutes depending on
  # the region size. Subsequent restarts reuse the cached tiles and
  # start in seconds.
  #
  # Change tile_urls to the Geofabrik extract for your region:
  #   https://download.geofabrik.de
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    volumes:
      - ./routario/valhalla:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/asia/iran-latest.osm.pbf
      - build_admins=True
      - build_time_zones=True
    ports:
      - "8002:8002"
    networks:
      - routario-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s   # allow up to 5 min for tile build on first run

networks:
  routario-net:
    driver: bridge
